<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Administrasi Kelas 6</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand-mark"><i class="bi bi-mortarboard-fill"></i></div>
    <h1>SISTEM ADMINISTRASI KELAS 6</h1>
    <p>MIS COKROAMINOTO PANYINGKIRAN · 2026/2027</p>
    <form id="loginForm">
      <label class="form-label">Username</label>
      <input id="username" class="form-control mb-3" value="admin" autocomplete="username">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control mb-3" autocomplete="current-password">
      <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
    </form>
    <div id="loginMsg" class="mt-3"></div>
  </div>
</div>

<div id="appView" class="d-none">
  <div class="topbar">
    <button class="btn btn-outline-light d-lg-none" id="menuBtn"><i class="bi bi-list"></i></button>
    <div><strong>SISTEM ADMINISTRASI KELAS 6</strong><small>MIS COKROAMINOTO PANYINGKIRAN · 2026/2027</small></div>
    <div class="ms-auto d-flex align-items-center gap-2"><span id="userName"></span><button id="logoutBtn" class="btn btn-sm btn-light">Keluar</button></div>
  </div>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <button data-page="dashboard" class="nav-item active"><i class="bi bi-grid-1x2"></i> Dashboard</button>
      <button data-page="students" class="nav-item"><i class="bi bi-people"></i> Data Siswa</button>
      <button data-page="teachers" class="nav-item"><i class="bi bi-person-badge"></i> Data Guru</button>
      <button data-page="classes" class="nav-item"><i class="bi bi-building"></i> Data Kelas</button>
      <button data-page="grades" class="nav-item"><i class="bi bi-journal-check"></i> Nilai</button>
      <button data-page="attendance" class="nav-item"><i class="bi bi-calendar-check"></i> Absensi</button>
      <button data-page="import" class="nav-item"><i class="bi bi-upload"></i> Import Data</button>
      <button data-page="export" class="nav-item"><i class="bi bi-download"></i> Export Data</button>
      <button data-page="settings" class="nav-item"><i class="bi bi-gear"></i> Pengaturan</button>
    </aside>
    <main class="content">
      <div id="loading" class="loading d-none"><div class="spinner-border spinner-border-sm"></div> <span>Memuat data...</span></div>
      <div id="toastArea"></div>
      <section id="dashboardPage" class="page"></section>
      <section id="studentsPage" class="page d-none"></section>
      <section id="teachersPage" class="page d-none"></section>
      <section id="classesPage" class="page d-none"></section>
      <section id="gradesPage" class="page d-none"></section>
      <section id="attendancePage" class="page d-none"></section>
      <section id="importPage" class="page d-none"></section>
      <section id="exportPage" class="page d-none"></section>
      <section id="settingsPage" class="page d-none"></section>
    </main>
  </div>
  <footer>© 2026 MIS Cokroaminoto Panyingkiran</footer>
</div>

<div class="modal fade" id="studentModal" tabindex="-1">
 <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <form id="studentForm"><div class="modal-header"><h5 id="studentModalTitle">Tambah Siswa</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="sID">
   <div class="row g-3">
    <div class="col-md-6"><label class="form-label">NISN *</label><input id="sNISN" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">NIS</label><input id="sNIS" class="form-control"></div>
    <div class="col-md-8"><label class="form-label">Nama Lengkap *</label><input id="sNama" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Jenis Kelamin *</label><select id="sJK" class="form-select" required><option value="">Pilih</option><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
    <div class="col-md-6"><label class="form-label">Tempat Lahir</label><input id="sTempat" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Tanggal Lahir</label><input id="sTgl" type="date" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Kelas</label><input id="sKelas" class="form-control" placeholder="6"></div>
    <div class="col-md-4"><label class="form-label">Nama Ayah</label><input id="sAyah" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Nama Ibu</label><input id="sIbu" class="form-control"></div>
    <div class="col-md-5"><label class="form-label">No HP Orang Tua</label><input id="sHP" class="form-control"></div>
    <div class="col-md-7"><label class="form-label">Status Siswa</label><select id="sStatus" class="form-select"><option>Aktif</option><option>Nonaktif</option><option>Lulus</option><option>Pindah</option></select></div>
    <div class="col-12"><label class="form-label">Alamat</label><textarea id="sAlamat" class="form-control" rows="2"></textarea></div>
   </div>
  </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary">Simpan</button></div>
  </form>
 </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>
